name: Build and push playground images

on:
  push:
    branches: [main]
    paths:
      - "playground/app/**"
      - "playground/sandbox/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: pbochynski/chs-examples

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push playground-app
        uses: docker/build-push-action@v6
        with:
          context: playground/app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/playground-app:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}/playground-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push playground-sandbox
        uses: docker/build-push-action@v6
        with:
          context: playground/sandbox
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/playground-sandbox:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}/playground-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
