# Reference copy — keep in sync with the spec in deploy.sh when changing env vars, egress, or sandboxing.
# Images are built by GitHub Actions: ghcr.io/pbochynski/chs-examples/playground-{app,sandbox}:latest
apiVersion: hosting.sap.com/v1alpha1
kind: SolutionDeployment
metadata:
  name: playground
  namespace: default
spec:
  solutionName: playground
  version: 1.0.0
  tenant: demo
  regions:
    - name: aws-eu-central-1
  assets:
    - id: app
      kind: service
      image: ghcr.io/pbochynski/chs-examples/playground-app:latest
      port: 8000
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}
      env:
        - name: JWT_SECRET
          value: ch-playground-demo-secret
        - name: SANDBOX_HOST
          value: sandbox-sandbox-router:8080
      requires:
        - sandbox

    - id: sandbox
      kind: agent
      image: ghcr.io/pbochynski/chs-examples/playground-sandbox:latest
      port: 8080
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}
      env:
        - name: JWT_SECRET
          value: ch-playground-demo-secret
      sandboxing:
        tenantClaim: sub
        idleTTL: 1m
      network:
        egress:
          allowedHosts:
            - pypi.org
            - files.pythonhosted.org
            - example.com
          allowedPorts: [443, 80]
